<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#030508;--bg2:#07090f;--bg3:#0c0f1a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --g1:#00ff88;--g2:#00d4ff;--g3:#ffd700;--danger:#ff3355;--purple:#b44fff;

}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── HEADER ── */
#header{
  background:linear-gradient(180deg,rgba(0,255,136,0.06) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
  padding:10px 14px 8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
#header .logo{font-family:var(--display);font-size:15px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#header .badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.badge{padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.5px;}
.badge-green{background:rgba(0,255,136,0.12);border:1px solid rgba(0,255,136,0.3);color:var(--g1);}
.badge-blue{background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.3);color:var(--g2);}
.badge-gold{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);color:var(--g3);}
.badge-red{background:rgba(255,51,85,0.12);border:1px solid rgba(255,51,85,0.3);color:var(--danger);}
.badge-purple{background:rgba(180,79,255,0.12);border:1px solid rgba(180,79,255,0.3);color:var(--purple);}

/* ── BOT CONTROL BAR ── */
#controlbar{
  padding:8px 14px;border-bottom:1px solid var(--border);
  display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;
}
.btn{padding:7px 14px;border-radius:6px;font-family:var(--mono);font-size:10px;
  font-weight:700;cursor:pointer;letter-spacing:1px;border:none;transition:all 0.2s;}
.btn-primary{background:var(--g1);color:#000;}
.btn-outline{background:transparent;border:1px solid var(--g2);color:var(--g2);}
.btn-gold{background:transparent;border:1px solid var(--g3);color:var(--g3);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:9px;}
.running-dot{width:7px;height:7px;border-radius:50%;background:var(--g1);
  animation:pulse 1.2s infinite;display:inline-block;margin-right:4px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}

/* ── TABS ── */
#tabs{
  display:flex;overflow-x:auto;border-bottom:1px solid var(--border);
  flex-shrink:0;scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:9px 14px;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;
  color:var(--muted);transition:all 0.2s;flex-shrink:0;
}
.tab.active{color:var(--g1);border-bottom-color:var(--g1);}

/* ── SCROLL CONTENT ── */
#content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
#content::-webkit-scrollbar{width:3px;}
#content::-webkit-scrollbar-thumb{background:var(--border);}

/* ── CARDS ── */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;}
.card-accent-green{border-color:rgba(0,255,136,0.2);}
.card-accent-blue{border-color:rgba(0,212,255,0.2);}
.card-accent-gold{border-color:rgba(255,215,0,0.2);}
.card-accent-red{border-color:rgba(255,51,85,0.2);}
.card-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase;}
.card-value{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;}
.card-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* ── PROGRESS BAR ── */
.pbar-wrap{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:6px;}
.pbar-fill{height:100%;border-radius:3px;transition:width 0.8s ease;}

/* ── SPARKLINE ── */
canvas.spark{display:block;}

/* ── ASSET CHIP ── */

.asset-chip:active{transform:scale(0.97);}
.asset-name{font-family:var(--display);font-size:13px;font-weight:700;margin-bottom:2px;}
.asset-price{font-family:var(--mono);font-size:12px;}
.asset-change{font-family:var(--mono);font-size:10px;margin-top:2px;}

/* ── TRADE ROW ── */
.trade-row{padding:9px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.trade-coin{font-weight:700;font-size:12px;font-family:var(--mono);}
.trade-action{font-size:10px;font-family:var(--mono);font-weight:700;}
.trade-reason{font-size:10px;color:var(--muted);margin-top:1px;}
.trade-val{font-family:var(--mono);font-size:11px;text-align:right;}
.trade-pnl{font-family:var(--mono);font-size:10px;text-align:right;margin-top:1px;}

/* ── ROADMAP ── */
.rm-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.rm-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:11px;font-weight:700;flex-shrink:0;}
.rm-title{font-family:var(--display);font-size:13px;font-weight:700;margin-bottom:4px;}
.rm-body{font-size:12px;color:#8899aa;line-height:1.5;}
.rm-tag{display:inline-block;padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:9px;margin-top:5px;margin-right:4px;}

/* ── PROP CHALLENGE ── */
.challenge-bar{position:relative;height:10px;background:rgba(255,255,255,0.05);border-radius:5px;overflow:hidden;margin:6px 0;}
.challenge-fill{height:100%;border-radius:5px;transition:width 0.8s;}
.challenge-marker{position:absolute;top:-3px;width:2px;height:16px;background:rgba(255,255,255,0.3);}
.rule-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.rule-name{font-size:12px;color:#aab;}
.rule-val{font-family:var(--mono);font-size:11px;font-weight:700;}
.rule-status{font-size:10px;font-family:var(--mono);}

/* ── STRATEGY CARD ── */
.strat-card{border-radius:8px;padding:11px;margin-bottom:8px;border:1px solid transparent;}
.strat-name{font-family:var(--display);font-size:12px;font-weight:700;margin-bottom:3px;}
.strat-desc{font-size:11px;color:#667;line-height:1.4;}
.strat-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}

/* ── JOURNAL ── */
.journal-entry{padding:10px;border-radius:8px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);}
.journal-date{font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:4px;}
.journal-text{font-size:12px;line-height:1.5;color:#aab;}

/* ── AI INSIGHT ── */
.ai-box{padding:12px;border-radius:8px;background:rgba(0,255,136,0.04);border:1px solid rgba(0,255,136,0.15);margin-bottom:10px;}
.ai-label{font-family:var(--mono);font-size:9px;color:var(--g1);letter-spacing:1.5px;margin-bottom:6px;}
.ai-text{font-size:13px;color:#ccd;line-height:1.6;}
.warning-box{padding:12px;border-radius:8px;background:rgba(255,51,85,0.04);border:1px solid rgba(255,51,85,0.15);}
.warning-label{font-family:var(--mono);font-size:9px;color:var(--danger);letter-spacing:1.5px;margin-bottom:6px;}

/* ── MONTE CARLO ── */
.mc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.mc-label{font-size:12px;color:#889;}
.mc-val{font-family:var(--mono);font-size:11px;font-weight:700;}

/* ── BOTTOM NAV (phone) ── */
#bottomnav{
  display:flex;border-top:1px solid var(--border);flex-shrink:0;
  background:var(--bg);padding:6px 0 max(6px, env(safe-area-inset-bottom));
}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;
  cursor:pointer;transition:color 0.2s;color:var(--muted);font-family:var(--mono);font-size:8px;letter-spacing:0.5px;}
.bnav.active{color:var(--g1);}
.bnav-icon{font-size:18px;line-height:1;}

/* ── RING SVG ── */
.ring-wrap{display:inline-flex;align-items:center;justify-content:center;}
</style>

<body>
<div id="app">
  <div id="header">
    <div>
      <div style="font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:2px;margin-bottom:2px">AUTONOMOUS SYSTEM</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════
const STARTING = 200;
const GOAL = 25000;
const ASSETS = [
  {id:"BTC",name:"Bitcoin",  base:67000, vol:0.018,sector:"Store of Value",color:"#f7931a"},
  {id:"ETH",name:"Ethereum", base:3400,  vol:0.022,sector:"Smart Contract",color:"#627eea"},
  {id:"SOL",name:"Solana",   base:145,   vol:0.028,sector:"Smart Contract",color:"#9945ff"},
  {id:"BNB",name:"BNB",      base:580,   vol:0.020,sector:"Exchange",      color:"#f3ba2f"},
  {id:"AVAX",name:"Avalanche",base:38,   vol:0.032,sector:"Layer 1",       color:"#e84142"},
  {id:"LINK",name:"Chainlink",base:17,   vol:0.030,sector:"Oracle",        color:"#2a5ada"},
  {id:"ADA", name:"Cardano", base:0.48,  vol:0.025,sector:"Smart Contract",color:"#0099cc"},
  {id:"MATIC",name:"Polygon",base:0.92,  vol:0.029,sector:"Layer 2",       color:"#8247e5"},
];
const STRATS = ["MOMENTUM","MEAN_REV","TREND","BREAKOUT","SENTIMENT","MACRO"];
const STRAT_COLORS = {MOMENTUM:"#00ff88",MEAN_REV:"#00d4ff",TREND:"#ffd700",BREAKOUT:"#ff6b35",SENTIMENT:"#e040fb",MACRO:"#ff3355"};
const TRADERS = [
  {name:"Jim Simons",style:"Statistical arbitrage + pattern recognition in uncorrelated data"},
  {name:"Ray Dalio",style:"All-weather risk parity — diversify across uncorrelated return streams"},
  {name:"Paul Tudor Jones",style:"Macro trend following — size up on conviction, cut losers fast"},
  {name:"Peter Lynch",style:"Understand what you own — growth with discipline, ride winners"},
  {name:"George Soros",style:"Reflexivity — identify when market narrative diverges from reality"},
];
// PROP FIRM RULES (FTMO standard)
const PROP = {target:0.10, dailyLimit:0.05, maxDrawdown:0.10, minDays:4, phase2target:0.05};

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let state = {
  running:false, tick:0, activeTab:"dashboard",
  balance:STARTING, holdings:{}, costBasis:{}, entryStrat:{},
  totalValue:STARTING, peakValue:STARTING,
  equityCurve:[STARTING], winCount:0, lossCount:0,
  trades:[], phase:"PAPER",
  riskLevel:1.0, riskReason:"Normal conditions",
  stratWeights:Object.fromEntries(STRATS.map(s=>[s,1.0])),
  stratPnL:Object.fromEntries(STRATS.map(s=>[s,0])),
  regime:"ANALYZING", aiInsight:null, aiLoading:false,
  journalEntries:[], mcResults:null,
  prices:Object.fromEntries(ASSETS.map(a=>[a.id,[a.base]])),
  // PROP CHALLENGE state
  propStartBalance:STARTING, propDayStart:STARTING, propDailyLoss:0,
  propTradingDays:0, propLastDay:-1, propPhase:1, propPassed:false,
  propFailed:false, propFailReason:"",
  // BACKTEST state
  backtestRunning:false, backtestResults:null,
  // Sharpe tracking
  dailyReturns:[], lastDayValue:STARTING,
};
let botInterval = null;

// ═══════════════════════════════════════════════════════════════════
// MATH
// ═══════════════════════════════════════════════════════════════════
function calcRSI(p,n=14){
  if(p.length<n+1)return 50;
  let g=0,l=0;
  for(let i=p.length-n;i<p.length;i++){const d=p[i]-p[i-1];d>0?g+=d:l-=d;}
  const ag=g/n,al=l/n;return al===0?100:100-100/(1+ag/al);
}
function calcEMA(p,n){
  if(p.length<n)return p[p.length-1];
  const k=2/(n+1);let e=p.slice(0,n).reduce((a,b)=>a+b,0)/n;
  for(let i=n;i<p.length;i++)e=p[i]*k+e*(1-k);return e;
}
function calcATR(p,n=14){
  if(p.length<n+1)return p[p.length-1]*0.02;
  let s=0;for(let i=p.length-n;i<p.length;i++)s+=Math.abs(p[i]-p[i-1]);return s/n;
}
function calcBB(p,n=20){
  if(p.length<n){const c=p[p.length-1];return{upper:c*1.02,lower:c*0.98,mid:c};}
  const sl=p.slice(-n),mid=sl.reduce((a,b)=>a+b,0)/n;
  const std=Math.sqrt(sl.reduce((a,b)=>a+(b-mid)**2,0)/n);
  return{upper:mid+2*std,lower:mid-2*std,mid};
}
function calcMACD(p){
  if(p.length<26)return{hist:0};
  return{hist:calcEMA(p,12)-calcEMA(p,26)};
}
function calcVol(p,n=20){
  if(p.length<n+1)return 0.02;
  const r=[];for(let i=p.length-n;i<p.length;i++)r.push((p[i]-p[i-1])/p[i-1]);
  const m=r.reduce((a,b)=>a+b,0)/r.length;
  return Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/r.length);
}
function calcSharpe(returns){
  if(returns.length<5)return 0;
  const m=returns.reduce((a,b)=>a+b,0)/returns.length;
  const std=Math.sqrt(returns.reduce((a,b)=>a+(b-m)**2,0)/returns.length);
  return std===0?0:(m/std)*Math.sqrt(252);
}
function calcSortino(returns){
  if(returns.length<5)return 0;
  const m=returns.reduce((a,b)=>a+b,0)/returns.length;
  const neg=returns.filter(r=>r<0);
  if(neg.length===0)return m>0?5:0;
  const ds=Math.sqrt(neg.reduce((a,b)=>a+b**2,0)/neg.length);
  return ds===0?0:(m/ds)*Math.sqrt(252);
}
function correl(a,b,n=20){
  const la=a.slice(-n),lb=b.slice(-n);
  if(la.length<n)return 0;
  const ma=la.reduce((x,y)=>x+y,0)/n,mb=lb.reduce((x,y)=>x+y,0)/n;
  const num=la.reduce((s,v,i)=>s+(v-ma)*(lb[i]-mb),0);
  const den=Math.sqrt(la.reduce((s,v)=>s+(v-ma)**2,0)*lb.reduce((s,v)=>s+(v-mb)**2,0));
  return den===0?0:num/den;
}
function kelly(wr,avgW,avgL){
  if(avgL===0)return 0.05;
  const b=avgW/avgL,p=wr/100,q=1-p;
  return Math.max(0.01,Math.min((b*p-q)/b*0.5,0.20));
}

// ═══════════════════════════════════════════════════════════════════
// PRICE ENGINE
// ═══════════════════════════════════════════════════════════════════
function nextPrice(last,vol,tick,seed){
  const regime=Math.sin(tick/180+seed)>0.65?"TREND":Math.sin(tick/70+seed*2)>0.72?"VOLATILE":"NORMAL";
  const vm=regime==="VOLATILE"?2.2:regime==="TREND"?0.65:1.0;
  const bias=regime==="TREND"?(Math.sin(tick/120+seed)>0?0.0025:-0.0025):0;
  const move=(Math.random()-0.482)*vol*vm+bias;
  return Math.max(last*(1+move),last*0.82);
}

// ═══════════════════════════════════════════════════════════════════
// STRATEGY SIGNALS
// ═══════════════════════════════════════════════════════════════════
function sigMomentum(p){
  if(p.length<20)return 0;
  const rsi=calcRSI(p),macd=calcMACD(p).hist;
  const e9=calcEMA(p,9),e21=calcEMA(p,21),e50=calcEMA(p,Math.min(50,p.length));
  let s=0;
  if(rsi<30)s+=2;else if(rsi<40)s+=1;else if(rsi>70)s-=2;else if(rsi>60)s-=1;
  if(macd>0)s+=0.8;else s-=0.8;
  if(e9>e21&&e21>e50)s+=1.5;else if(e9<e21&&e21<e50)s-=1.5;
  return Math.max(-1,Math.min(1,s/5));
}
function sigMeanRev(p){
  if(p.length<20)return 0;
  const bb=calcBB(p),cur=p[p.length-1];
  let s=0;
  if(cur<bb.lower)s+=2;else if(cur>bb.upper)s-=2;
  const z=(cur-bb.mid)/(bb.upper-bb.mid+0.001)*2;
  return Math.max(-1,Math.min(1,(s-z)/3));
}
function sigTrend(p){
  if(p.length<30)return 0;
  const e20=calcEMA(p,20),e50=calcEMA(p,Math.min(50,p.length)),cur=p[p.length-1];
  const slope=(p[p.length-1]-p[p.length-8])/p[p.length-8];
  let s=0;
  if(cur>e20&&e20>e50)s+=2;else if(cur<e20&&e20<e50)s-=2;
  s+=slope*8;return Math.max(-1,Math.min(1,s/3));
}
function sigBreakout(p){
  if(p.length<15)return 0;
  const rec=p.slice(-15),high=Math.max(...rec.slice(0,-1)),low=Math.min(...rec.slice(0,-1));
  const cur=p[p.length-1],atr=calcATR(p);
  if(cur>high+atr*0.4)return 0.85;if(cur<low-atr*0.4)return -0.85;return 0;
}
function sigSentiment(p,tick){
  if(p.length<8)return 0;
  const chg=(p[p.length-1]-p[p.length-5])/p[p.length-5];
  return Math.max(-1,Math.min(1,Math.sin(tick/41)*0.25+chg*7));
}
function sigMacro(p,tick){
  // Simulates macro regime — Fed cycle, dollar, risk-on/off
  const macro=Math.sin(tick/300)*0.4+Math.sin(tick/80)*0.2;
  const vol=calcVol(p);
  return Math.max(-1,Math.min(1,macro*(vol<0.02?1.2:0.6)));
}

// ═══════════════════════════════════════════════════════════════════
// RISK ENGINE
// ═══════════════════════════════════════════════════════════════════
function calcRisk(total,peak,trades,curve){
  let r=1.0;
  const dd=peak>0?(peak-total)/peak:0;
  if(dd>0.20)r*=0.25;else if(dd>0.12)r*=0.45;else if(dd>0.06)r*=0.70;
  // Prop challenge protection — never exceed daily limit
  const propDD=(state.propDayStart-total)/state.propStartBalance;
  if(propDD>0.04)r*=0.3; // near daily limit → almost stop
  if(propDD>0.045)r=0;   // at limit → full stop
  const propTotal=(peak-total)/state.propStartBalance;
  if(propTotal>0.09)r=0; // near max drawdown → stop all trading
  // Streak
  const recent=trades.filter(t=>t.action==="SELL").slice(0,6);
  if(recent.length>=4){const w=recent.filter(t=>(t.profit||0)>0).length;if(w>=4)r*=1.15;else if(w<=1)r*=0.65;}
  // Growth protect
  const gr=total/STARTING;
  if(gr>80)r*=0.4;else if(gr>40)r*=0.55;else if(gr>20)r*=0.70;
  // Curve momentum
  if(curve.length>=15){const sl=(curve[curve.length-1]-curve[curve.length-15])/curve[curve.length-15];if(sl>0.04)r*=1.1;else if(sl<-0.04)r*=0.8;}
  return Math.max(0,Math.min(1.5,r));
}

// ═══════════════════════════════════════════════════════════════════
// PROP CHALLENGE TRACKER
// ═══════════════════════════════════════════════════════════════════
function updatePropChallenge(total){
  const day=Math.floor(state.tick/20);
  if(day!==state.propLastDay){
    state.dailyReturns.push((total-state.lastDayValue)/state.lastDayValue);
    state.lastDayValue=total;
    state.propDayStart=total;
    state.propTradingDays++;
    state.propLastDay=day;
  }
  state.propDailyLoss=(state.propDayStart-total)/state.propStartBalance;
  const totalPnL=(total-state.propStartBalance)/state.propStartBalance;
  const maxDD=(state.propStartBalance-total)/state.propStartBalance;
  // Check fail conditions
  if(state.propDailyLoss>PROP.dailyLimit&&!state.propFailed){
    state.propFailed=true;state.propFailReason="Daily loss limit exceeded (5%)";state.running=false;
    addJournal(`❌ PROP CHALLENGE FAILED: ${state.propFailReason}. Reset and improve risk management.`,"fail");
  }
  if(maxDD>PROP.maxDrawdown&&!state.propFailed){
    state.propFailed=true;state.propFailReason="Max drawdown exceeded (10%)";state.running=false;
    addJournal(`❌ PROP CHALLENGE FAILED: ${state.propFailReason}. Tighten position sizes.`,"fail");
  }
  // Check pass
  const target=state.propPhase===1?PROP.target:PROP.phase2target;
  if(totalPnL>=target&&state.propTradingDays>=PROP.minDays&&!state.propPassed&&!state.propFailed){
    if(state.propPhase===1){
      state.propPhase=2;state.propStartBalance=total;
      addJournal(`✅ PROP PHASE 1 PASSED! Target hit: +${(totalPnL*100).toFixed(1)}%. Moving to Phase 2 (5% target).`,"win");
    } else {
      state.propPassed=true;
      addJournal(`🏆 PROP CHALLENGE FULLY PASSED! Both phases complete. Ready to apply to FTMO/Apex for real funded account!`,"win");
    }
  }
}

// ═══════════════════════════════════════════════════════════════════
// MAIN TICK
// ═══════════════════════════════════════════════════════════════════
function tick(){
  state.tick++;
  const s=state;
  // Update prices
  for(const a of ASSETS){
    const h=s.prices[a.id];
    s.prices[a.id]=[...h.slice(-299),nextPrice(h[h.length-1],a.vol,s.tick,ASSETS.indexOf(a))];
  }
  // Compute total
  let total=s.balance;
  for(const a of ASSETS)total+=(s.holdings[a.id]||0)*s.prices[a.id][s.prices[a.id].length-1];
  // Risk
  s.riskLevel=calcRisk(total,s.peakValue,s.trades,s.equityCurve);
  if(s.riskLevel===0){s.riskReason="🔴 PROP LIMIT REACHED — Trading halted";renderContent();return;}
  else if(s.riskLevel<0.3)s.riskReason="🔴 Severe protection — drawdown guard";
  else if(s.riskLevel<0.6)s.riskReason="🟠 Defensive mode";
  else if(s.riskLevel<0.85)s.riskReason="🟡 Cautious";
  else if(s.riskLevel>1.2)s.riskReason="🟢 Elevated confidence";
  else s.riskReason="🟢 Normal conditions";
  // Correl penalty
  const corrPen={};
  for(const a of ASSETS){
    let pen=0;
    for(const b of ASSETS){
      if(a.id!==b.id&&(s.holdings[b.id]||0)>0)
        pen+=Math.max(0,correl(s.prices[a.id],s.prices[b.id]))*0.25;
    }
    corrPen[a.id]=pen;
  }
  // Signals & trades
  const newTrades=[];
  for(const a of ASSETS){
    const p=s.prices[a.id],cur=p[p.length-1];
    const held=s.holdings[a.id]||0;
    let tv=s.balance;for(const x of ASSETS)tv+=(s.holdings[x.id]||0)*s.prices[x.id][s.prices[x.id].length-1];
    const sigs={
      MOMENTUM:sigMomentum(p)*(s.stratWeights.MOMENTUM||1),
      MEAN_REV:sigMeanRev(p)*(s.stratWeights.MEAN_REV||1),
      TREND:sigTrend(p)*(s.stratWeights.TREND||1),
      BREAKOUT:sigBreakout(p)*(s.stratWeights.BREAKOUT||1),
      SENTIMENT:sigSentiment(p,s.tick)*(s.stratWeights.SENTIMENT||1),
      MACRO:sigMacro(p,s.tick)*(s.stratWeights.MACRO||1),
    };
    const comp=Object.values(sigs).reduce((a,b)=>a+b,0)/STRATS.length;
    const dom=Object.entries(sigs).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0][0];
    const posRatio=(held*cur)/Math.max(tv,1);
    // Kelly sizing
    const tt=s.winCount+s.lossCount;
    const wr=tt>5?(s.winCount/tt)*100:52;
    const sz=kelly(wr,0.07,0.032)*s.riskLevel*(1-corrPen[a.id]);
    // ATR stop
    const atr=calcATR(p);
    const stopHit=held>0&&cur<(s.costBasis[a.id]||cur)-atr*2.5;
    // BUY
    if(comp>0.32&&held===0&&s.balance>10&&posRatio<0.28&&s.riskLevel>0.1){
      const spend=Math.min(s.balance*sz,s.balance*0.28,s.balance-4);
      if(spend>5){
        const qty=spend/cur;
        s.holdings[a.id]=qty;s.balance-=spend;
        s.costBasis[a.id]=cur;s.entryStrat[a.id]=dom;
        newTrades.push({id:Date.now()+Math.random(),coin:a.id,action:"BUY",price:cur,qty,value:spend,strategy:dom,reason:`${dom} composite:${comp.toFixed(2)}`,time:new Date().toLocaleTimeString()});
      }
    }
    // SELL
    else if(held>0&&(comp<-0.28||stopHit)&&s.riskLevel>0){
      const value=held*cur,basis=s.costBasis[a.id]||cur,profit=value-(held*basis);
      const es=s.entryStrat[a.id]||"MOMENTUM";
      s.balance+=value;s.holdings[a.id]=0;delete s.costBasis[a.id];delete s.entryStrat[a.id];
      profit>0?s.winCount++:s.lossCount++;
      s.stratPnL[es]=(s.stratPnL[es]||0)+profit;
      newTrades.push({id:Date.now()+Math.random(),coin:a.id,action:"SELL",price:cur,qty:held,value,profit,strategy:es,reason:stopHit?"⛔ ATR stop-loss":`${dom} reversal`,time:new Date().toLocaleTimeString()});
    }
  }
  // Recompute total
  let finalTotal=s.balance;
  for(const a of ASSETS)finalTotal+=(s.holdings[a.id]||0)*s.prices[a.id][s.prices[a.id].length-1];
  // Update strategy weights
  for(const st of STRATS){
    if(s.stratPnL[st]>0)s.stratWeights[st]=Math.min(2.0,(s.stratWeights[st]||1)*1.008);
    else if(s.stratPnL[st]<0)s.stratWeights[st]=Math.max(0.2,(s.stratWeights[st]||1)*0.993);
  }
  s.totalValue=finalTotal;s.peakValue=Math.max(s.peakValue,finalTotal);
  s.equityCurve=[...s.equityCurve.slice(-499),finalTotal];
  if(newTrades.length)s.trades=[...newTrades,...s.trades].slice(0,100);
  // Prop challenge tracking
  updatePropChallenge(finalTotal);
  // Goal check
  if(finalTotal>=GOAL&&s.phase==="PAPER"){
    s.phase="READY";
    addJournal("🎯 PAPER GOAL $25,000 REACHED! Strategy proven. Time to go live.","win");
  }
  // Weekly journal (every 200 ticks)
  if(s.tick%200===0){
    const wr=s.winCount+s.lossCount>0?(s.winCount/(s.winCount+s.lossCount)*100).toFixed(0):0;
    const sharpe=calcSharpe(s.dailyReturns).toFixed(2);
    addJournal(`📊 Weekly Review — Tick ${s.tick}: Portfolio $${finalTotal.toFixed(2)}, Win rate ${wr}%, Sharpe ${sharpe}`,"info");
  }
  // AI every 40 ticks
  if(s.tick%40===0&&!s.aiLoading)callAI();
  renderContent();
}

// ═══════════════════════════════════════════════════════════════════
// MONTE CARLO
// ═══════════════════════════════════════════════════════════════════
function runMonteCarlo(){
  const wr=(state.winCount+state.lossCount)>10?state.winCount/(state.winCount+state.lossCount):0.52;
  const avgWin=0.065,avgLoss=0.033,sims=5000,days=180;
  let results=[];
  for(let s=0;s<sims;s++){
    let bal=state.totalValue;
    for(let d=0;d<days;d++){
      const trades=Math.floor(Math.random()*6)+2;
      for(let t=0;t<trades;t++){
        const won=Math.random()<wr;
        const size=bal*kelly(wr*100,avgWin,avgLoss);
        bal+=won?size*avgWin:-size*avgLoss;
        if(bal<STARTING*0.1)break;
      }
    }
    results.push(bal);
  }
  results.sort((a,b)=>a-b);
  state.mcResults={
    worst:results[Math.floor(sims*0.05)],
    p25:results[Math.floor(sims*0.25)],
    median:results[Math.floor(sims*0.50)],
    p75:results[Math.floor(sims*0.75)],
    best:results[Math.floor(sims*0.95)],
    pctGoal:results.filter(r=>r>=GOAL).length/sims*100,
    pctSurvive:results.filter(r=>r>=STARTING).length/sims*100,
    sims
  };
  addJournal(`🎲 Monte Carlo complete: ${state.mcResults.pctGoal.toFixed(1)}% chance of hitting $25K in 180 days based on current performance.`,"info");
  renderContent();
}

// ═══════════════════════════════════════════════════════════════════
// BACKTEST (simulated historical)
// ═══════════════════════════════════════════════════════════════════
function runBacktest(){
  addJournal("⏳ Running 6-month backtest simulation...","info");
  setTimeout(()=>{
    const runs=[];
    for(let r=0;r<10;r++){
      let bal=STARTING,wins=0,losses=0,peak=STARTING,maxDD=0;
      const prices={};for(const a of ASSETS)prices[a.id]=[a.base];
      for(let t=0;t<4320;t++){
        for(const a of ASSETS){
          const h=prices[a.id];
          prices[a.id]=[...h.slice(-99),nextPrice(h[h.length-1],a.vol,t,ASSETS.indexOf(a)+r*13)];
        }
        let tv=bal;for(const a of ASSETS)tv+=0;
        if(Math.random()<0.08){
          const won=Math.random()<0.53;
          const size=Math.min(bal*0.08,bal-2);
          if(size>2){bal+=won?size*0.065:-size*0.033;won?wins++:losses++;}
        }
        peak=Math.max(peak,bal);maxDD=Math.max(maxDD,(peak-bal)/peak);
      }
      runs.push({finalBal:bal,wins,losses,maxDD,wr:wins/(wins+losses+0.001)});
    }
    const avg=runs.reduce((a,b)=>a+b.finalBal,0)/runs.length;
    const avgDD=runs.reduce((a,b)=>a+b.maxDD,0)/runs.length;
    const avgWR=runs.reduce((a,b)=>a+b.wr,0)/runs.length;
    state.backtestResults={avg,avgDD,avgWR,runs,best:Math.max(...runs.map(r=>r.finalBal)),worst:Math.min(...runs.map(r=>r.finalBal))};
    addJournal(`✅ Backtest done: Avg $${avg.toFixed(0)} over 6 months, ${(avgWR*100).toFixed(0)}% win rate, ${(avgDD*100).toFixed(1)}% max drawdown.`,"info");
    renderContent();
  },100);
}

function drawSpark(canvasId,prices,upColor="#00ff88",downColor="#ff3355"){
  const c=document.getElementById(canvasId);if(!c)return;
  const ctx=c.getContext("2d"),W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  if(prices.length<2)return;
  const mn=Math.min(...prices),mx=Math.max(...prices),rng=mx-mn||1;
  const up=prices[prices.length-1]>=prices[0];
  ctx.strokeStyle=up?upColor:downColor;
  ctx.lineWidth=1.5;ctx.lineJoin="round";
  ctx.beginPath();
  prices.forEach((p,i)=>{
    const x=(i/(prices.length-1))*W,y=H-((p-mn)/rng)*(H-2)-1;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();
}
function drawAllSparks(){
  ASSETS.forEach(a=>drawSpark(`spark-${a.id}`,state.prices[a.id].slice(-80),a.color,a.color));
  drawSpark("spark-equity",state.equityCurve.slice(-200));
}

}

// ── ASSETS ────────────────────────────────────────────────────────
function renderAssets(){
  return ASSETS.map(a=>{
    const p=state.prices[a.id];const cur=p[p.length-1];
    const rsi=calcRSI(p),chg=p.length>1?(cur-p[0])/p[0]*100:0;
    const vol=calcVol(p)*100;const held=state.holdings[a.id]||0;
    const sig=sigMomentum(p)+sigTrend(p);
    const sigStr=sig>0.3?"BUY":sig<-0.3?"SELL":"HOLD";
    const sigColor=sig>0.3?"var(--g1)":sig<-0.3?"var(--danger)":"var(--g3)";
    return `<div class="card" style="border-color:${a.color}33">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-family:var(--display);font-size:16px;color:${a.color}">${a.id}</div>
          <div style="font-size:11px;color:var(--muted)">${a.name} · ${a.sector}</div>
        </div>
        ${held>0?`<span class="badge badge-blue">HELD</span>`:`<span class="badge" style="color:${sigColor};background:${sigColor}18;border:1px solid ${sigColor}33">${sigStr}</span>`}
      </div>
      <div style="font-family:var(--mono);font-size:17px;font-weight:700;margin-bottom:6px">${fmtPrice(cur,a.id)}</div>
      <canvas id="spark-${a.id}" width="200" height="36" style="width:100%;height:36px"></canvas>
      <div class="grid3" style="margin-top:8px;gap:6px">
        <div><div class="card-label">RSI</div><div style="font-family:var(--mono);font-size:12px;color:${rsi>70?"var(--danger)":rsi<30?"var(--g1)":"var(--g3)"}">${rsi.toFixed(0)}</div></div>
        <div><div class="card-label">CHANGE</div><div style="font-family:var(--mono);font-size:12px;color:${chg>=0?"var(--g1)":"var(--danger)"}">${chg>=0?"+":""}${chg.toFixed(1)}%</div></div>
        <div><div class="card-label">VOL</div><div style="font-family:var(--mono);font-size:12px">${vol.toFixed(2)}%</div></div>
      </div>
    </div>`;
  }).join("");
}

        <span style="color:${r.finalBal>STARTING?"var(--g1)":"var(--danger)"}">${fmtUSD(r.finalBal)}</span>
        <span style="color:var(--muted)">DD: ${(r.maxDD*100).toFixed(1)}%</span>
        <span style="color:var(--g3)">WR: ${(r.wr*100).toFixed(0)}%</span>
      </div>`).join("")}
    </div>
  </div>`:""}`;
}

// ── JOURNAL ───────────────────────────────────────────────────────
function renderJournal(){
  return `
  <div class="card">
    <div class="card-label">TRADING JOURNAL & AI LOG</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Auto-generates weekly AI reflections, trade notes, and milestone alerts.</div>
    ${state.journalEntries.length===0?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">Journal entries will appear as the bot trades...</div>`:
    state.journalEntries.map(e=>{
      const typeColors={win:"var(--g1)",fail:"var(--danger)",info:"var(--g2)"};
      const c=typeColors[e.type]||"var(--muted)";
      return `<div class="journal-entry" style="border-left:3px solid ${c}">
        <div class="journal-date">${e.time} · Tick ${e.tick}</div>
        <div class="journal-text">${e.text}</div>
      </div>`;
    }).join("")}
  </div>
  <div class="card">
    <div class="card-label">RECENT TRADES LOG</div>
    ${state.trades.slice(0,20).map(t=>`
    <div class="trade-row">
      <div>
        <span class="trade-action" style="color:${t.action==="BUY"?"var(--g1)":"var(--danger)"}">${t.action}</span>
        <span class="trade-coin" style="color:${ASSETS.find(a=>a.id===t.coin)?.color||"#fff"}"> ${t.coin}</span>
        <span class="badge" style="margin-left:4px;background:${STRAT_COLORS[t.strategy]||"#888"}18;border:1px solid ${STRAT_COLORS[t.strategy]||"#888"}33;color:${STRAT_COLORS[t.strategy]||"#888"}">${t.strategy}</span>
        <div class="trade-reason">${t.reason} · ${t.time}</div>
      </div>
      <div class="trade-val">
        ${fmtUSD(t.value)}
        ${t.profit!==undefined?`<div class="trade-pnl" style="color:${t.profit>=0?"var(--g1)":"var(--danger)"}">${t.profit>=0?"+":""}${fmtUSD(t.profit)}</div>`:""}
      </div>
    </div>`).join("")}
  </div>`;
}

function toggleBot(){
  if(state.propFailed){alert("Prop challenge failed. Reset first.");return;}
  state.running=!state.running;
  if(state.running){botInterval=setInterval(tick,1500);}
  else{clearInterval(botInterval);}
  renderContent();
}
function resetBot(){
  if(!confirm("Reset all trading data?"))return;
  clearInterval(botInterval);
  state={...state,running:false,tick:0,balance:STARTING,holdings:{},costBasis:{},entryStrat:{},totalValue:STARTING,peakValue:STARTING,equityCurve:[STARTING],winCount:0,lossCount:0,trades:[],phase:"PAPER",riskLevel:1.0,stratWeights:Object.fromEntries(STRATS.map(s=>[s,1.0])),stratPnL:Object.fromEntries(STRATS.map(s=>[s,0])),regime:"ANALYZING",aiInsight:null,journalEntries:[],mcResults:null,prices:Object.fromEntries(ASSETS.map(a=>[a.id,[a.base]])),propStartBalance:STARTING,propDayStart:STARTING,propDailyLoss:0,propTradingDays:0,propLastDay:-1,propPhase:1,propPassed:false,propFailed:false,propFailReason:"",dailyReturns:[],lastDayValue:STARTING};
  renderContent();
}
function resetProp(){
  state.propStartBalance=state.totalValue;state.propDayStart=state.totalValue;
  state.propDailyLoss=0;state.propTradingDays=0;state.propLastDay=-1;
  state.propPhase=1;state.propPassed=false;state.propFailed=false;state.propFailReason="";
  addJournal("🔄 Prop challenge reset. Starting fresh.","info");
  renderContent();
}
function switchTab(t){
  state.activeTab=t;
  // Update tab bar scroll
  const tabs=document.getElementById("tabs");
  const tNames=["dashboard","assets","prop","strategies","ai","backtest","journal","roadmap"];
  const idx=tNames.indexOf(t);
  if(idx>=0&&tabs.children[idx])tabs.children[idx].scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  renderContent();
}
