<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#020407"/>
<title>APEX TRADER</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;800&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#020407;--bg2:#060c12;--bg3:#0a1520;
  --g1:#00e5ff;--g2:#00ff9d;--g3:#ffcc00;
  --danger:#ff2d55;--purple:#bf5fff;
  --border:rgba(0,229,255,0.1);--border2:rgba(0,229,255,0.2);
  --text:#c8d8e8;--muted:#3a5060;
  --mono:'JetBrains Mono',monospace;--display:'Oxanium',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--display);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;}

/* scanline overlay */
#app::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.015) 3px);pointer-events:none;z-index:100;}

/* HEADER */
#hdr{
  padding:10px 14px 8px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(0,229,255,0.06) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-size:20px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(90deg,var(--g1),var(--g2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--g2);
  box-shadow:0 0 8px var(--g2);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.hdr-right{display:flex;align-items:center;gap:8px;}
.badge{padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;}
.badge-cyan{background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);color:var(--g1);}
.badge-green{background:rgba(0,255,157,0.1);border:1px solid rgba(0,255,157,0.3);color:var(--g2);}
.badge-gold{background:rgba(255,204,0,0.1);border:1px solid rgba(255,204,0,0.3);color:var(--g3);}
.badge-red{background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.3);color:var(--danger);}

/* TABS */
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 16px;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;white-space:nowrap;
  cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all 0.2s;flex-shrink:0;}
.tab.active{color:var(--g1);border-bottom-color:var(--g1);}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
#content::-webkit-scrollbar{width:2px;}
#content::-webkit-scrollbar-thumb{background:var(--border);}

/* CARDS */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--g1),transparent);opacity:0.3;}
.card-cyan{border-color:rgba(0,229,255,0.25);}
.card-green{border-color:rgba(0,255,157,0.25);}
.card-gold{border-color:rgba(255,204,0,0.25);}
.card-red{border-color:rgba(255,45,85,0.25);}
.lbl{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:2px;margin-bottom:5px;text-transform:uppercase;}
.val{font-size:24px;font-weight:800;line-height:1;}
.sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* SPARKLINE */
canvas{display:block;width:100%;border-radius:4px;}

/* PROGRESS */
.pbar{height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;margin-top:6px;}
.pfill{height:100%;border-radius:2px;transition:width 1s ease;}

/* BOT CARD */
.bot-card{background:var(--bg2);border-radius:8px;padding:11px;margin-bottom:8px;
  border:1px solid var(--border);transition:border-color 0.3s;}
.bot-name{font-size:13px;font-weight:800;letter-spacing:2px;margin-bottom:2px;}
.bot-status{font-family:var(--mono);font-size:9px;color:var(--muted);}

/* TRADE ROW */
.tr{padding:8px 0;border-bottom:1px solid rgba(0,229,255,0.06);
  display:flex;justify-content:space-between;align-items:flex-start;}
.tr-coin{font-size:12px;font-weight:700;letter-spacing:1px;}
.tr-action{font-family:var(--mono);font-size:9px;font-weight:700;}
.tr-reason{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;}
.tr-val{font-family:var(--mono);font-size:11px;text-align:right;}
.tr-pnl{font-family:var(--mono);font-size:10px;text-align:right;margin-top:1px;}

/* BOTTOM NAV */
#bnav{display:flex;border-top:1px solid var(--border);flex-shrink:0;
  background:var(--bg);padding:6px 0 max(6px,env(safe-area-inset-bottom));}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:8px;
  letter-spacing:0.5px;transition:color 0.2s;}
.bn.active{color:var(--g1);}
.bn-icon{font-size:17px;line-height:1;}

/* PULSE ANIMATION */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,157,0.4)}50%{box-shadow:0 0 0 6px rgba(0,255,157,0)}}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:var(--muted);font-family:var(--mono);font-size:11px;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--g1);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* REPORT */
.report-box{padding:12px;background:rgba(0,229,255,0.04);border-radius:8px;
  border:1px solid rgba(0,229,255,0.15);font-size:12px;line-height:1.7;color:#aab;}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div>
      <div style="font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:3px;margin-bottom:2px">LIVE TRADING SYSTEM</div>
      <div class="logo">APEX TRADER</div>
    </div>
    <div class="hdr-right">
      <span class="status-dot"></span>
      <span class="badge badge-green" id="modeBadge">PAPER</span>
      <span class="badge badge-cyan" id="lastUpdate">--:--</span>
    </div>
  </div>

  <div id="tabs">
    <div class="tab active" onclick="switchTab('dashboard')">DASHBOARD</div>
    <div class="tab" onclick="switchTab('bots')">BOTS</div>
    <div class="tab" onclick="switchTab('trades')">TRADES</div>
    <div class="tab" onclick="switchTab('report')">REPORT</div>
    <div class="tab" onclick="switchTab('roadmap')">ROADMAP</div>
  </div>

  <div id="content"></div>

  <div id="bnav">
    <div class="bn active" onclick="switchTab('dashboard')"><div class="bn-icon">📊</div>DASH</div>
    <div class="bn" onclick="switchTab('bots')"><div class="bn-icon">🤖</div>BOTS</div>
    <div class="bn" onclick="switchTab('trades')"><div class="bn-icon">💹</div>TRADES</div>
    <div class="bn" onclick="switchTab('report')"><div class="bn-icon">🧠</div>AI</div>
    <div class="bn" onclick="switchTab('roadmap')"><div class="bn-icon">🗺</div>MAP</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — Your Supabase credentials
// ═══════════════════════════════════════════════
const SUPABASE_URL = "https://npuqacqhodsharmhrtce.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZXbzIWVZgTIGydS79NrYoQ_MvxvX-LI"; // Replace with your sb_publishable_ key

const BOT_IDS = ["BOT1_MOMENTUM","BOT2_MEAN_REV","BOT3_TREND"];
const BOT_NAMES = {BOT1_MOMENTUM:"MOMENTUM",BOT2_MEAN_REV:"MEAN REV",BOT3_TREND:"TREND"};
const BOT_COLORS = {BOT1_MOMENTUM:"#00e5ff",BOT2_MEAN_REV:"#00ff9d",BOT3_TREND:"#ffcc00"};
const STARTING = 200;
const GOAL = 25000;

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let state = {
  activeTab:"dashboard",
  trades:[],
  equity:{},
  stats:{},
  weights:{},
  report:null,
  loading:true,
  lastFetch:null,
};

// ═══════════════════════════════════════════════
// SUPABASE FETCH
// ═══════════════════════════════════════════════
async function sbFetch(table, params="") {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    }
  });
  if (!r.ok) throw new Error(`${table}: ${r.status}`);
  return r.json();
}

async function loadData() {
  try {
    // Trades
    const trades = await sbFetch("trades", "order=timestamp.desc&limit=100");
    state.trades = trades || [];

    // Equity history per bot
    for (const bot of BOT_IDS) {
      const eq = await sbFetch("equity_history",
        `bot_id=eq.${bot}&order=timestamp.desc&limit=100`);
      state.equity[bot] = (eq || []).reverse();
    }

    // Bot stats
    for (const bot of BOT_IDS) {
      const s = await sbFetch("bot_stats", `bot_id=eq.${bot}`);
      state.stats[bot] = s && s[0] ? s[0] : {wins:0,losses:0,peak_equity:STARTING};
    }

    // Strategy weights
    for (const bot of BOT_IDS) {
      const w = await sbFetch("strategy_weights", `bot_id=eq.${bot}`);
      state.weights[bot] = w && w[0] ? w[0].weights : {};
    }

    // Latest report
    const reports = await sbFetch("reports", "order=timestamp.desc&limit=1");
    state.report = reports && reports[0] ? reports[0] : null;

    state.loading = false;
    state.lastFetch = new Date();
    document.getElementById("lastUpdate").textContent =
      state.lastFetch.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    render();
  } catch(e) {
    console.error("Load error:", e);
    state.loading = false;
    state.error = e.message;
    render();
  }
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function fmtUSD(n) {
  const abs = Math.abs(n);
  const s = abs >= 1000 ? `$${(abs/1000).toFixed(2)}K` :
            `$${abs.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  return n < 0 ? `-${s}` : s;
}
function pct(n) { return `${n>=0?"+":""}${n.toFixed(2)}%`; }

function totalEquity() {
  let total = 0;
  for (const bot of BOT_IDS) {
    const eq = state.equity[bot];
    if (eq && eq.length > 0) total += eq[eq.length-1].equity;
  }
  return total || STARTING * BOT_IDS.length;
}

function combinedCurve() {
  // Get max length
  const maxLen = Math.max(...BOT_IDS.map(b => (state.equity[b]||[]).length));
  if (maxLen === 0) return [STARTING * BOT_IDS.length];
  const combined = [];
  for (let i = 0; i < maxLen; i++) {
    let sum = 0;
    for (const bot of BOT_IDS) {
      const eq = state.equity[bot] || [];
      const idx = Math.round(i * (eq.length-1) / (maxLen-1));
      sum += eq[idx] ? eq[idx].equity : STARTING;
    }
    combined.push(sum);
  }
  return combined;
}

function drawSpark(id, data, upColor="#00e5ff") {
  setTimeout(() => {
    const c = document.getElementById(id);
    if (!c || data.length < 2) return;
    const W = c.offsetWidth || 300, H = c.height || 48;
    c.width = W;
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,W,H);
    const mn = Math.min(...data), mx = Math.max(...data), rng = mx-mn||1;
    const up = data[data.length-1] >= data[0];
    const color = up ? upColor : "#ff2d55";
    // gradient fill
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, color + "33");
    grad.addColorStop(1, color + "00");
    ctx.beginPath();
    data.forEach((p,i) => {
      const x = (i/(data.length-1))*W;
      const y = H - ((p-mn)/rng)*(H-4) - 2;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    // line
    ctx.beginPath();
    data.forEach((p,i) => {
      const x = (i/(data.length-1))*W;
      const y = H - ((p-mn)/rng)*(H-4) - 2;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = "round";
    ctx.stroke();
  }, 60);
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render() {
  updateNav();
  const c = document.getElementById("content");
  if (state.loading) {
    c.innerHTML = `<div class="loading"><div class="spinner"></div>Loading live data from Supabase...</div>`;
    return;
  }
  if (state.error && state.trades.length === 0) {
    c.innerHTML = `<div class="card card-red">
      <div class="lbl">CONNECTION ERROR</div>
      <div style="font-family:var(--mono);font-size:11px;color:#ff2d55;margin-bottom:8px">${state.error}</div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted)">
        Make sure your Supabase key is set in the app and your bots have run at least once.
        <br><br>Check GitHub Actions for errors.
      </div>
    </div>`;
    return;
  }
  switch(state.activeTab) {
    case "dashboard": c.innerHTML = renderDashboard(); break;
    case "bots":      c.innerHTML = renderBots();      break;
    case "trades":    c.innerHTML = renderTrades();    break;
    case "report":    c.innerHTML = renderReport();    break;
    case "roadmap":   c.innerHTML = renderRoadmap();   break;
  }
  // Draw sparklines after render
  const curve = combinedCurve();
  if (curve.length > 1) drawSpark("spark-main", curve, "#00e5ff");
  for (const bot of BOT_IDS) {
    const eq = (state.equity[bot]||[]).map(e=>e.equity);
    if (eq.length > 1) drawSpark(`spark-${bot}`, eq, BOT_COLORS[bot]);
  }
}

function updateNav() {
  document.querySelectorAll(".tab").forEach((t,i) => {
    const names = ["dashboard","bots","trades","report","roadmap"];
    t.classList.toggle("active", names[i]===state.activeTab);
  });
  document.querySelectorAll(".bn").forEach((b,i) => {
    const names = ["dashboard","bots","trades","report","roadmap"];
    b.classList.toggle("active", names[i]===state.activeTab);
  });
}

// ── DASHBOARD ──────────────────────────────────
function renderDashboard() {
  const total = totalEquity();
  const startTotal = STARTING * BOT_IDS.length;
  const pnl = total - startTotal;
  const pnlP = pnl / startTotal * 100;
  const goalPct = Math.min(total / GOAL * 100, 100);
  const pnlColor = pnl >= 0 ? "var(--g2)" : "var(--danger)";

  let allWins = 0, allLosses = 0;
  for (const bot of BOT_IDS) {
    allWins += state.stats[bot]?.wins || 0;
    allLosses += state.stats[bot]?.losses || 0;
  }
  const totalTrades = allWins + allLosses;
  const wr = totalTrades > 0 ? allWins/totalTrades*100 : 0;

  const allSells = state.trades.filter(t=>t.action==="SELL");
  const totalPnL = allSells.reduce((s,t)=>s+(t.profit||0),0);

  return `
  <div class="card card-cyan">
    <div class="lbl">TOTAL PORTFOLIO</div>
    <div class="val" style="color:${pnlColor}">${fmtUSD(total)}</div>
    <div class="sub" style="color:${pnlColor}">${pct(pnlP)} · ${pnl>=0?"+":""}${fmtUSD(pnl)} total P&L</div>
    <canvas id="spark-main" height="48" style="margin-top:10px"></canvas>
    <div class="pbar">
      <div class="pfill" style="width:${goalPct}%;background:linear-gradient(90deg,var(--g1),var(--g2))"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:3px">
      <span>$${startTotal} START</span><span>${goalPct.toFixed(1)}% → $${GOAL.toLocaleString()} GOAL</span>
    </div>
  </div>

  <div class="g2">
    <div class="card">
      <div class="lbl">WIN RATE</div>
      <div class="val" style="font-size:26px;color:${wr>=55?"var(--g2)":wr>=45?"var(--g3)":"var(--danger)"}">${wr.toFixed(0)}%</div>
      <div class="sub">${allWins}W · ${allLosses}L · ${totalTrades} total</div>
    </div>
    <div class="card">
      <div class="lbl">REALIZED P&L</div>
      <div class="val" style="font-size:22px;color:${totalPnL>=0?"var(--g2)":"var(--danger)"}">${totalPnL>=0?"+":""}${fmtUSD(totalPnL)}</div>
      <div class="sub">${allSells.length} closed trades</div>
    </div>
  </div>

  <div class="card">
    <div class="lbl">3 BOTS — LIVE STATUS</div>
    ${BOT_IDS.map(bot=>{
      const eq = state.equity[bot]||[];
      const cur = eq.length > 0 ? eq[eq.length-1].equity : STARTING;
      const prev = eq.length > 1 ? eq[eq.length-2].equity : STARTING;
      const chg = (cur-prev)/prev*100;
      const color = BOT_COLORS[bot];
      const trades = state.trades.filter(t=>t.bot_id===bot);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:8px;height:8px;border-radius:50%;background:${color};box-shadow:0 0 6px ${color}"></div>
          <div>
            <div style="font-size:11px;font-weight:700;color:${color};letter-spacing:1px">${BOT_NAMES[bot]}</div>
            <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">${trades.length} trades logged</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--mono);font-size:12px;font-weight:700">${fmtUSD(cur)}</div>
          <div style="font-family:var(--mono);font-size:9px;color:${chg>=0?"var(--g2)":"var(--danger)"}">${chg>=0?"+":""}${chg.toFixed(2)}%</div>
        </div>
      </div>`;
    }).join("")}
  </div>

  ${state.trades.length > 0 ? `
  <div class="card">
    <div class="lbl">RECENT TRADES</div>
    ${state.trades.slice(0,4).map(t=>`
    <div class="tr">
      <div>
        <span class="tr-action" style="color:${t.action==="BUY"?"var(--g2)":"var(--danger)"}">${t.action}</span>
        <span class="tr-coin" style="margin-left:6px">${t.symbol?.replace("/USD","")}</span>
        <div class="tr-reason">${t.reason||t.strategy} · ${t.bot_id?.replace("BOT","B")}</div>
      </div>
      <div class="tr-val">${fmtUSD(t.value||0)}
        ${t.profit!=null?`<div class="tr-pnl" style="color:${t.profit>=0?"var(--g2)":"var(--danger)"}">${t.profit>=0?"+":""}${fmtUSD(t.profit)}</div>`:""}
      </div>
    </div>`).join("")}
  </div>` : `
  <div class="card">
    <div class="lbl">TRADES</div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--muted);padding:12px 0">
      No trades yet — bots are analyzing markets.<br>Check back after the next GitHub Actions run.
    </div>
  </div>`}
  `;
}

// ── BOTS ───────────────────────────────────────
function renderBots() {
  return BOT_IDS.map(bot=>{
    const eq = state.equity[bot]||[];
    const cur = eq.length > 0 ? eq[eq.length-1].equity : STARTING;
    const stats = state.stats[bot]||{wins:0,losses:0};
    const weights = state.weights[bot]||{};
    const color = BOT_COLORS[bot];
    const tt = (stats.wins||0)+(stats.losses||0);
    const wr = tt > 0 ? (stats.wins||0)/tt*100 : 0;
    const pnl = cur - STARTING;
    const pnlP = pnl/STARTING*100;
    const trades = state.trades.filter(t=>t.bot_id===bot);
    const botSells = trades.filter(t=>t.action==="SELL");
    const totalBotPnL = botSells.reduce((s,t)=>s+(t.profit||0),0);
    const peakDD = stats.peak_equity > 0 ? (stats.peak_equity-cur)/stats.peak_equity*100 : 0;
    return `
    <div class="card" style="border-color:${color}33">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="font-size:14px;font-weight:800;color:${color};letter-spacing:2px">${BOT_NAMES[bot]}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px">${bot}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--mono);font-size:16px;font-weight:700">${fmtUSD(cur)}</div>
          <div style="font-family:var(--mono);font-size:10px;color:${pnl>=0?"var(--g2)":"var(--danger)"}">${pct(pnlP)}</div>
        </div>
      </div>
      <canvas id="spark-${bot}" height="40" style="margin-bottom:10px"></canvas>
      <div class="g3" style="gap:6px;margin-bottom:10px">
        <div style="background:var(--bg2);padding:7px;border-radius:6px">
          <div class="lbl">WIN RATE</div>
          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:${wr>=50?"var(--g2)":"var(--danger)"}">${wr.toFixed(0)}%</div>
        </div>
        <div style="background:var(--bg2);padding:7px;border-radius:6px">
          <div class="lbl">TRADES</div>
          <div style="font-family:var(--mono);font-size:13px;font-weight:700">${tt}</div>
        </div>
        <div style="background:var(--bg2);padding:7px;border-radius:6px">
          <div class="lbl">P&L</div>
          <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:${totalBotPnL>=0?"var(--g2)":"var(--danger)"}">${totalBotPnL>=0?"+":""}${fmtUSD(totalBotPnL)}</div>
        </div>
      </div>
      <div class="lbl">AI STRATEGY WEIGHTS</div>
      ${Object.entries(weights).filter(([k])=>k.includes("weight")).map(([k,v])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">${k.replace("_weight","").toUpperCase()}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:80px;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden">
              <div style="width:${Math.min((v/2)*100,100)}%;height:100%;background:${color};border-radius:2px"></div>
            </div>
            <div style="font-family:var(--mono);font-size:9px;color:${color}">${(v*100).toFixed(0)}%</div>
          </div>
        </div>`).join("")}
      ${Object.keys(weights).filter(k=>k.includes("weight")).length===0?
        `<div style="font-family:var(--mono);font-size:10px;color:var(--muted)">Weights update after first AI brain run (Sunday)</div>`:""}
      <div class="lbl" style="margin-top:8px">DRAWDOWN FROM PEAK</div>
      <div class="pbar">
        <div class="pfill" style="width:${Math.min(peakDD,100)}%;background:${peakDD>10?"var(--danger)":peakDD>5?"var(--g3)":"var(--g2)"}"></div>
      </div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px">${peakDD.toFixed(1)}% from peak ${fmtUSD(stats.peak_equity||STARTING)}</div>
    </div>`;
  }).join("");
}

// ── TRADES ─────────────────────────────────────
function renderTrades() {
  const sells = state.trades.filter(t=>t.action==="SELL");
  const buys = state.trades.filter(t=>t.action==="BUY");
  const wins = sells.filter(t=>(t.profit||0)>0);
  return `
  <div class="card card-cyan">
    <div class="lbl">TRADE LOG — ${state.trades.length} TOTAL</div>
    <div class="g3" style="gap:6px;margin-top:4px">
      <div style="background:var(--bg2);padding:8px;border-radius:6px;text-align:center">
        <div class="lbl">BUYS</div>
        <div style="font-family:var(--mono);font-size:16px;color:var(--g2)">${buys.length}</div>
      </div>
      <div style="background:var(--bg2);padding:8px;border-radius:6px;text-align:center">
        <div class="lbl">SELLS</div>
        <div style="font-family:var(--mono);font-size:16px;color:var(--danger)">${sells.length}</div>
      </div>
      <div style="background:var(--bg2);padding:8px;border-radius:6px;text-align:center">
        <div class="lbl">WIN %</div>
        <div style="font-family:var(--mono);font-size:16px;color:${wins.length/Math.max(sells.length,1)*100>=50?"var(--g2)":"var(--danger)"}">${sells.length>0?(wins.length/sells.length*100).toFixed(0):0}%</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="lbl">ALL TRADES</div>
    ${state.trades.length === 0 ?
      `<div style="font-family:var(--mono);font-size:11px;color:var(--muted);padding:16px 0">No trades yet. Bots run every 15 minutes via GitHub Actions.</div>` :
      state.trades.slice(0,30).map(t=>{
        const color = BOT_COLORS[t.bot_id]||"#fff";
        const sym = t.symbol?.replace("/USD","");
        const ts = t.timestamp ? new Date(t.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "";
        return `<div class="tr">
          <div>
            <div style="display:flex;gap:6px;align-items:center">
              <span class="tr-action" style="color:${t.action==="BUY"?"var(--g2)":"var(--danger)"}">${t.action}</span>
              <span class="tr-coin" style="color:${color}">${sym}</span>
              <span style="font-family:var(--mono);font-size:8px;color:${color};background:${color}18;padding:1px 5px;border-radius:3px">${BOT_NAMES[t.bot_id]||t.bot_id}</span>
            </div>
            <div class="tr-reason">${t.reason||t.strategy||""} · ${ts}</div>
          </div>
          <div class="tr-val">${fmtUSD(t.value||0)}
            ${t.profit!=null?`<div class="tr-pnl" style="color:${t.profit>=0?"var(--g2)":"var(--danger)"}">${t.profit>=0?"+":""}${fmtUSD(t.profit)}</div>`:""}
          </div>
        </div>`;
      }).join("")
    }
  </div>`;
}

// ── REPORT ─────────────────────────────────────
function renderReport() {
  const r = state.report;
  return `
  <div class="card card-cyan">
    <div class="lbl">AI BRAIN — WEEKLY ANALYSIS</div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px">
      Claude analyzes all trade history every Sunday and rewrites strategy weights.
      Reports are generated automatically and saved here.
    </div>
    ${r ? `
    <div style="font-family:var(--mono);font-size:9px;color:var(--g1);margin-bottom:8px">
      Week ending: ${new Date(r.week_ending).toLocaleDateString()}
    </div>
    <div class="report-box">${r.report_text}</div>
    ` : `
    <div class="report-box" style="color:var(--muted)">
      No AI report yet. The AI Brain runs every Sunday automatically,
      or you can trigger it manually in GitHub Actions by running the workflow
      with "run_ai_brain" set to true.
    </div>`}
  </div>
  <div class="card">
    <div class="lbl">CURRENT STRATEGY WEIGHTS</div>
    ${BOT_IDS.map(bot=>{
      const w = state.weights[bot]||{};
      const color = BOT_COLORS[bot];
      return `<div style="margin-bottom:12px">
        <div style="font-size:11px;font-weight:700;color:${color};letter-spacing:1px;margin-bottom:6px">${BOT_NAMES[bot]}</div>
        ${Object.entries(w).length > 0 ?
          Object.entries(w).map(([k,v])=>`
          <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-bottom:3px">
            <span style="color:var(--muted)">${k}</span>
            <span style="color:${color}">${typeof v==="number"?v.toFixed(2):v}</span>
          </div>`).join("") :
          `<div style="font-family:var(--mono);font-size:9px;color:var(--muted)">No weights yet — updates after first AI run</div>`
        }
      </div>`;
    }).join("")}
  </div>`;
}

// ── ROADMAP ─────────────────────────────────────
function renderRoadmap() {
  const total = totalEquity();
  const startTotal = STARTING * BOT_IDS.length;
  const pnlP = (total-startTotal)/startTotal*100;
  const steps = [
    {n:1,t:"Paper Trading — Build Track Record",done:true,color:"var(--g2)",
     d:"3 bots running 24/7 on Alpaca paper trading. Real prices, zero risk. Building proven track record."},
    {n:2,t:"Pass Prop Challenge Simulation",done:pnlP>=10,color:"var(--g1)",
     d:`Hit +10% profit target without exceeding 5% daily or 10% total drawdown. Current: ${pct(pnlP)}`},
    {n:3,t:"Apply to Apex Trader Funding",done:false,color:"var(--g3)",
     d:"Pass the simulation 3x consistently, then apply. Apex runs ~$20 promos. $50K-$300K funded accounts available."},
    {n:4,t:"Deposit Real $200 on Alpaca",done:false,color:"#ff6b35",
     d:"Switch ALPACA_PAPER to false in GitHub Secrets. Same strategy, real money. Start conservative."},
    {n:5,t:"First Prop Payout",done:false,color:"var(--purple)",
     d:"5% monthly on $50K funded = $2,500/month. Keep 90% = $2,250. Reinvest to scale accounts."},
    {n:6,t:"Match Job Income — Year 3-4",done:false,color:"var(--g2)",
     d:"$100-200K funded, $3,150-$6,300/month take-home. The path to staying home with your kids."},
  ];
  return `
  <div class="card card-gold" style="margin-bottom:14px">
    <div class="lbl">YOUR MISSION</div>
    <div style="font-size:15px;font-weight:800;color:var(--g3)">$200 → FUNDED TRADER → STAY HOME</div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px">Pay off $400K house · $150K/year · Be present for your kids</div>
    <div class="pbar" style="margin-top:10px">
      <div class="pfill" style="width:${Math.min(Math.max(pnlP,0),100)}%;background:var(--g3)"></div>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px">Progress toward 10% prop challenge target: ${pct(Math.max(pnlP,0))}</div>
  </div>
  ${steps.map(s=>`
  <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
    <div style="width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      background:${s.done?s.color+"33":"var(--bg2)"};border:1px solid ${s.done?s.color:s.color+"44"};
      font-size:11px;font-weight:800;color:${s.done?s.color:"var(--muted)"}">
      ${s.done?"✓":s.n}
    </div>
    <div style="flex:1">
      <div style="font-size:12px;font-weight:700;color:${s.done?s.color:"var(--text)"};margin-bottom:4px">${s.t}</div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5">${s.d}</div>
    </div>
  </div>`).join("")}
  <div style="padding:14px 0;font-family:var(--mono);font-size:9px;color:var(--muted);line-height:1.6">
    Year 1: ~$9,450 · Year 2: ~$37,800 · Year 3: ~$75,600 · Year 4: ~$113,400 · Year 5: ~$151,200
  </div>`;
}

// ═══════════════════════════════════════════════
// NAVIGATION & INIT
// ═══════════════════════════════════════════════
function switchTab(t) {
  state.activeTab = t;
  render();
  document.getElementById("content").scrollTop = 0;
}

// Auto-refresh every 5 minutes
setInterval(() => { loadData(); }, 5 * 60 * 1000);

// Initial load
loadData();
</script>
</body>
</html>
