<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#080f0a"/>
<title>APEX TRADER</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080f0a;--bg2:#0d1a10;--bg3:#111f14;--bg4:#162419;
  --green:#1aff6e;--green2:#0dcc58;--green3:#a8ffca;
  --gold:#ffd166;--red:#ff4757;--blue:#54a0ff;--purple:#a29bfe;
  --white:#e8f5ec;--muted:#3a6645;--border:rgba(26,255,110,0.12);
  --border2:rgba(26,255,110,0.25);
  --mono:'IBM Plex Mono',monospace;--sans:'Syne',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* subtle grid bg */
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(26,255,110,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,255,110,0.03) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;z-index:0;}

/* HEADER */
#hdr{
  padding:10px 16px 8px;flex-shrink:0;position:relative;z-index:10;
  background:linear-gradient(180deg,rgba(26,255,110,0.08) 0%,transparent 100%);
  border-bottom:1px solid var(--border2);
}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;}
.logo-area{display:flex;flex-direction:column;}
.logo-eyebrow{font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:3px;margin-bottom:2px;}
.logo{font-size:22px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,var(--green),var(--green3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;
  background:rgba(26,255,110,0.1);border:1px solid var(--border2);
  font-family:var(--mono);font-size:9px;color:var(--green);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.time-pill{padding:3px 8px;border-radius:20px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);font-family:var(--mono);font-size:9px;color:var(--muted);}

/* MODE TOGGLE */
.mode-toggle{display:flex;gap:0;background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;margin-top:8px;}
.mode-btn{flex:1;padding:5px 8px;font-family:var(--mono);font-size:9px;letter-spacing:1px;
  text-align:center;cursor:pointer;color:var(--muted);transition:all 0.2s;}
.mode-btn.active{background:rgba(26,255,110,0.15);color:var(--green);}

/* TABS */
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;position:relative;z-index:10;}
#tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 14px;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;
  white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;
  color:var(--muted);transition:all 0.2s;flex-shrink:0;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;position:relative;z-index:10;}
#content::-webkit-scrollbar{width:2px;}
#content::-webkit-scrollbar-thumb{background:var(--border);}

/* CARDS */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:0.3;}
.card-green{border-color:rgba(26,255,110,0.3);}
.card-gold{border-color:rgba(255,209,102,0.3);}
.card-red{border-color:rgba(255,71,87,0.3);}
.card-blue{border-color:rgba(84,160,255,0.3);}

/* LEARN TOOLTIP */
.learn-wrap{position:relative;display:inline-block;}
.learn-icon{display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;background:rgba(26,255,110,0.15);
  border:1px solid var(--border2);font-family:var(--mono);font-size:8px;
  color:var(--green);cursor:pointer;margin-left:4px;vertical-align:middle;}
.tooltip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
  background:var(--bg4);border:1px solid var(--border2);border-radius:8px;
  padding:10px 12px;font-family:var(--mono);font-size:10px;color:var(--green3);
  line-height:1.5;width:220px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--border2);}
.learn-wrap:hover .tooltip,.learn-wrap:focus .tooltip{display:block;}

/* LEARN BOX */
.learn-box{background:rgba(26,255,110,0.05);border:1px solid rgba(26,255,110,0.2);
  border-radius:8px;padding:10px 12px;margin-top:8px;
  font-family:var(--mono);font-size:10px;color:var(--green3);line-height:1.6;}
.learn-label{font-size:8px;letter-spacing:2px;color:var(--green);margin-bottom:4px;
  display:flex;align-items:center;gap:4px;}

/* STAT GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;}
.stat-lbl{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:2px;
  margin-bottom:4px;display:flex;align-items:center;}
.stat-val{font-size:20px;font-weight:800;line-height:1;}
.stat-sub{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;}

/* PROGRESS */
.pbar{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:6px;}
.pfill{height:100%;border-radius:3px;transition:width 1.2s ease;}

/* SPARKLINE */
canvas{display:block;width:100%;}

/* TRADE ROW */
.tr{padding:10px 0;border-bottom:1px solid rgba(26,255,110,0.06);}
.tr-top{display:flex;justify-content:space-between;align-items:flex-start;}
.tr-coin{font-size:16px;font-weight:800;letter-spacing:1px;}
.tr-action{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;
  padding:2px 6px;border-radius:3px;}
.tr-buy{background:rgba(26,255,110,0.15);color:var(--green);}
.tr-sell{background:rgba(255,71,87,0.15);color:var(--red);}
.tr-reason{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;}
.tr-plain{font-size:11px;color:var(--green3);margin-top:4px;line-height:1.4;}
.tr-val{font-family:var(--mono);font-size:12px;text-align:right;}
.tr-pnl{font-family:var(--mono);font-size:11px;font-weight:700;text-align:right;margin-top:2px;}

/* BOT CARD */
.bot-card{background:var(--bg2);border-radius:8px;padding:12px;margin-bottom:8px;
  border:1px solid var(--border);}
.bot-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.bot-name{font-size:15px;font-weight:800;letter-spacing:1px;}
.bot-strategy{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;}
.bot-explain{font-size:11px;color:var(--green3);line-height:1.5;margin-top:6px;
  padding:8px;background:rgba(26,255,110,0.04);border-radius:6px;}

/* GLOSSARY */
.gloss-item{padding:12px 0;border-bottom:1px solid var(--border);}
.gloss-term{font-size:15px;font-weight:700;color:var(--green);margin-bottom:4px;}
.gloss-def{font-family:var(--mono);font-size:10px;color:var(--white);line-height:1.6;}
.gloss-example{font-family:var(--mono);font-size:9px;color:var(--muted);
  margin-top:6px;padding:6px 8px;background:var(--bg2);border-radius:4px;}

/* LOG */
.log-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
.log-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px;}
.log-win{background:rgba(26,255,110,0.15);border:1px solid rgba(26,255,110,0.3);}
.log-loss{background:rgba(255,71,87,0.15);border:1px solid rgba(255,71,87,0.3);}
.log-buy{background:rgba(84,160,255,0.15);border:1px solid rgba(84,160,255,0.3);}
.log-title{font-size:13px;font-weight:700;}
.log-detail{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;line-height:1.5;}
.log-lesson{font-family:var(--mono);font-size:10px;color:var(--green3);margin-top:4px;
  padding:5px 8px;background:rgba(26,255,110,0.05);border-radius:4px;}

/* ROADMAP */
.rm-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.rm-num{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:12px;}
.rm-done{background:rgba(26,255,110,0.2);border:1px solid var(--green);color:var(--green);}
.rm-next{background:rgba(255,209,102,0.15);border:1px solid var(--gold);color:var(--gold);}
.rm-future{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);}
.rm-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.rm-desc{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;}

/* BOTTOM NAV */
#bnav{display:flex;border-top:1px solid var(--border);flex-shrink:0;
  background:var(--bg);padding:5px 0 max(5px,env(safe-area-inset-bottom));
  position:relative;z-index:10;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:7px;
  letter-spacing:0.5px;transition:color 0.2s;}
.bn.active{color:var(--green);}
.bn-icon{font-size:16px;line-height:1;}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:var(--muted);font-family:var(--mono);font-size:11px;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* SECTION HEADER */
.sec-hdr{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:3px;
  margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="hdr-inner">
      <div class="logo-area">
        <div class="logo-eyebrow">AUTONOMOUS TRADING SYSTEM</div>
        <div class="logo">APEX TRADER</div>
      </div>
      <div class="hdr-right">
        <div class="live-pill"><div class="live-dot"></div>LIVE</div>
        <div class="time-pill" id="timeLbl">--:--</div>
      </div>
    </div>
    <div class="mode-toggle">
      <div class="mode-btn active" id="modeSimple" onclick="setMode('simple')">📚 SIMPLE MODE</div>

    <div class="tab" onclick="switchTab('roadmap')">ROADMAP</div>

  <div id="content"></div>

  </div>
</div>

<script>
const SB_URL = "https://npuqacqhodsharmhrtce.supabase.co";
const SB_KEY = "sb_publishable_ZXbzIWVZgTIGydS79NrYoQ_MvxvX-LI";
const BOTS = ["BOT1_MOMENTUM","BOT2_MEAN_REV","BOT3_TREND"];
const BOT_NAMES = {BOT1_MOMENTUM:"Momentum Bot",BOT2_MEAN_REV:"Mean Reversion Bot",BOT3_TREND:"Trend Bot"};
const BOT_COLORS = {BOT1_MOMENTUM:"#1aff6e",BOT2_MEAN_REV:"#54a0ff",BOT3_TREND:"#ffd166"};
const START_TOTAL = 300000; // $100k per bot × 3
const GOAL_YEAR1 = 150000; // $150k/year income goal

let state = {tab:"dash", mode:"simple", trades:[], equity:{}, stats:{}, weights:{}, report:null, loading:true};

async function sbFetch(table, params="") {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadData() {
  try {
    state.trades = await sbFetch("trades","order=timestamp.desc&limit=200") || [];
    for (const b of BOTS) {
      const eq = await sbFetch("equity_history",`bot_id=eq.${b}&order=timestamp.desc&limit=100`);
      state.equity[b] = (eq||[]).reverse();
      const s = await sbFetch("bot_stats",`bot_id=eq.${b}`);
      state.stats[b] = s?.[0] || {wins:0,losses:0,peak_equity:100000};
      const w = await sbFetch("strategy_weights",`bot_id=eq.${b}`);
      state.weights[b] = w?.[0]?.weights || {};
    }
    const rep = await sbFetch("reports","order=timestamp.desc&limit=1");
    state.report = rep?.[0] || null;
    state.loading = false;
    render();
  } catch(e) {
    state.loading = false; render();
  }
}

function totalEquity() {
  let t = 0;
  for (const b of BOTS) {
    const eq = state.equity[b];
    t += eq?.length > 0 ? eq[eq.length-1].equity : 100000;
  }
  return t;
}

function fmtUSD(n, dec=2) {
  const abs = Math.abs(n);
  const s = abs >= 1000000 ? `$${(abs/1000000).toFixed(2)}M` :
            abs >= 1000 ? `$${(abs/1000).toFixed(1)}K` :
            `$${abs.toFixed(dec)}`;
  return n < 0 ? `-${s}` : s;
}

function pct(n) { return `${n>=0?"+":""}${n.toFixed(2)}%`; }

function plainEnglishTrade(trade) {
  const action = trade.action === "BUY" ? "bought" : "sold";
  const sym = trade.symbol?.replace("/USD","");
  const reason = trade.reason || "";
  let plain = `The bot ${action} ${sym}`;
  if (reason.includes("RSI") && reason.includes("oversold")) plain += " because it was deeply oversold — meaning too many people sold it recently and a bounce was likely.";
  else if (reason.includes("Bullish EMA")) plain += " because multiple moving averages lined up pointing upward — a classic buy signal.";
  else if (reason.includes("Fear")) plain += " because the market Fear & Greed Index showed extreme fear — historically a good time to buy.";
  else if (reason.includes("BB lower")) plain += " because the price dropped below its normal range (Bollinger Band) — suggesting it may bounce back.";
  else if (reason.includes("stop-loss")) plain += " automatically to protect from further losses — this is risk management working correctly.";
  else plain += " based on multiple technical signals agreeing.";
  return plain;
}

function learnWrap(term, tip) {
  return `<span class="learn-wrap"><span class="learn-icon" tabindex="0">?</span><span class="tooltip">${tip}</span></span>`;
}

function drawSpark(id, data, color) {
  setTimeout(() => {
    const c = document.getElementById(id);
    if (!c || data.length < 2) return;
    const W = c.offsetWidth||300, H = c.height||48;
    c.width = W;
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,W,H);
    const mn = Math.min(...data), mx = Math.max(...data), rng = mx-mn||1;
    const up = data[data.length-1] >= data[0];
    const col = up ? color : "#ff4757";
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, col+"40"); grad.addColorStop(1, col+"00");
    ctx.beginPath();
    data.forEach((p,i)=>{const x=(i/(data.length-1))*W,y=H-((p-mn)/rng)*(H-4)-2;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();
    data.forEach((p,i)=>{const x=(i/(data.length-1))*W,y=H-((p-mn)/rng)*(H-4)-2;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineJoin="round";ctx.stroke();
  },60);
}

function setMode(m) {
  state.mode = m;
  document.getElementById("modeSimple").classList.toggle("active", m==="simple");
  document.getElementById("modeAdv").classList.toggle("active", m==="advanced");
  render();
}

// ═══════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════
function renderDash() {
  const total = totalEquity();
  const pnl = total - START_TOTAL;
  const pnlP = pnl / START_TOTAL * 100;
  const isSimple = state.mode === "simple";

  const sells = state.trades.filter(t=>t.action==="SELL");
  const wins = sells.filter(t=>(t.profit||0)>0);
  const totalPnL = sells.reduce((s,t)=>s+(t.profit||0),0);
  let allW=0,allL=0;
  for(const b of BOTS){allW+=state.stats[b]?.wins||0;allL+=state.stats[b]?.losses||0;}
  const tt=allW+allL, wr=tt>0?allW/tt*100:0;

  // Goal: $150k/year from prop firms. Need funded account track record.
  // Paper trading $300K → prove strategy → get funded
  const monthlyPnL = totalPnL; // total so far
  const annualizedRate = pnlP * (365/Math.max(1, daysSinceStart()));
  const propGoalPct = Math.min(Math.max(pnlP, 0) / 10 * 100, 100); // 10% paper target before applying

  return `
  <div class="card card-green">
    <div class="sec-hdr">PORTFOLIO VALUE</div>
    <div style="font-size:32px;font-weight:800;color:${pnl>=0?"var(--green)":"var(--red)"};line-height:1">${fmtUSD(total)}</div>
    <div style="font-family:var(--mono);font-size:11px;color:${pnl>=0?"var(--green)":"var(--red)"};margin-top:4px">
      ${pct(pnlP)} · ${pnl>=0?"+":""}${fmtUSD(pnl)} total change
    </div>
    ${isSimple?`<div class="learn-box"><div class="learn-label">💡 WHAT THIS MEANS</div>
    This is the total value of all 3 bots combined. You started with $300,000 in paper (fake) money spread across 3 bots. 
    Paper money lets you test strategies with zero real risk. When results are good, you'll apply to a prop firm to trade with their real money.
    </div>`:""}
    <canvas id="spark-total" height="48" style="margin-top:10px"></canvas>
    <div style="margin-top:8px">
      <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--muted);margin-bottom:4px">
        <span>PROP CHALLENGE PROGRESS</span>
        <span>${propGoalPct.toFixed(1)}% of 10% target</span>
      </div>
      <div class="pbar">
        <div class="pfill" style="width:${propGoalPct}%;background:linear-gradient(90deg,var(--green),var(--green3))"></div>
      </div>
      ${isSimple?`<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px">
        Hit +10% profit to qualify for prop firm application → get funded with $50K-$300K real money
      </div>`:""}
    </div>
  </div>

  <div class="g2">
    <div class="stat-box">
      <div class="stat-lbl">WIN RATE ${learnWrap("wr","Win Rate = the % of closed trades that made money. Above 50% is good. Above 60% is excellent.")}</div>
      <div class="stat-val" style="color:${wr>=55?"var(--green)":wr>=45?"var(--gold)":"var(--red)"}">${wr.toFixed(0)}%</div>
      <div class="stat-sub">${allW}W · ${allL}L · ${tt} total</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">REALIZED P&L ${learnWrap("pnl","Realized P&L = actual profit/loss from trades that are already closed. Open positions don't count until sold.")}</div>
      <div class="stat-val" style="font-size:18px;color:${totalPnL>=0?"var(--green)":"var(--red)"}">${totalPnL>=0?"+":""}${fmtUSD(totalPnL)}</div>
      <div class="stat-sub">${sells.length} closed trades</div>

function daysSinceStart() {
  const trades = state.trades;
  if (!trades.length) return 1;
  const first = new Date(trades[trades.length-1].timestamp||Date.now());
  return Math.max(1, (Date.now()-first)/86400000);
}

function renderLog() {
  const sells = state.trades.filter(t=>t.action==="SELL");
  const buys  = state.trades.filter(t=>t.action==="BUY");
  const wins  = sells.filter(t=>(t.profit||0)>0);
  const losses= sells.filter(t=>(t.profit||0)<=0);
  const totalPnL = sells.reduce((s,t)=>s+(t.profit||0),0);
  const wr = sells.length>0?wins.length/sells.length*100:0;

  // Build log entries from all trades
  const logEntries = [...state.trades].slice(0,30).map(t=>{
    const isSell = t.action==="SELL";
    const hasProfit = (t.profit||0)!==0;
    const won = (t.profit||0)>0;
    let type = isSell&&hasProfit ? (won?"win":"loss") : "buy";
    let icon = type==="win"?"✅":type==="loss"?"❌":"📈";
    let cls = type==="win"?"log-win":type==="loss"?"log-loss":"log-buy";
    const sym = t.symbol?.replace("/USD","");
    const ts = t.timestamp?new Date(t.timestamp).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";

    let title = t.action==="BUY"?`Bought ${sym}`:won?`Sold ${sym} for profit`:`Sold ${sym} at a loss`;
    let detail = `${ts} · ${t.bot_id?.replace("BOT","")} · ${fmtUSD(t.value||0)}`;
    if (t.profit!=null) detail += ` · P&L: ${t.profit>=0?"+":""}${fmtUSD(t.profit)}`;

    let lesson = "";
    if (type==="win") lesson = `✅ This trade worked! The signal was correct — ${t.reason||"technical signals aligned"}.`;
    else if (type==="loss") lesson = `📖 This trade lost money. That's normal — even the best traders lose ~40% of trades. What matters is wins are bigger than losses.`;
    else lesson = `⏳ This position is still open. The bot is waiting for the right moment to sell.`;

    return `<div class="log-item">
      <div class="log-icon ${cls}">${icon}</div>
      <div style="flex:1">
        <div class="log-title">${title}</div>
        <div class="log-detail">${detail}</div>
        <div class="log-detail" style="margin-top:2px;color:var(--green3)">${t.reason||""}</div>
        <div class="log-lesson">${lesson}</div>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="card card-green">
    <div class="sec-hdr">TRADING JOURNAL</div>
    <div class="learn-box"><div class="learn-label">📓 WHAT IS THIS?</div>
    Professional traders keep a journal of every trade to learn from successes and mistakes.
    This tab shows every action your bots took with plain-English explanations of what happened and why.
    </div>
    <div class="g3" style="margin-top:12px;gap:6px">
      <div class="stat-box" style="text-align:center">
        <div style="font-size:22px">✅</div>
        <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--green)">${wins.length}</div>
        <div style="font-family:var(--mono);font-size:8px;color:var(--muted)">WINS</div>
      </div>
      <div class="stat-box" style="text-align:center">
        <div style="font-size:22px">❌</div>
        <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--red)">${losses.length}</div>
        <div style="font-family:var(--mono);font-size:8px;color:var(--muted)">LOSSES</div>
      </div>
      <div class="stat-box" style="text-align:center">
        <div style="font-size:22px">📈</div>
        <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--blue)">${buys.length-sells.length}</div>
        <div style="font-family:var(--mono);font-size:8px;color:var(--muted)">OPEN</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="sec-hdr">ACTIVITY LOG</div>
    ${state.trades.length===0?`<div style="font-family:var(--mono);font-size:11px;color:var(--muted);padding:16px 0">No activity yet. Check back after the bots have traded!</div>`:logEntries}
  </div>`;
}

function renderLearn() {
  const terms = [
    {term:"RSI (Relative Strength Index)",
     def:"A number from 0-100 that measures if something is overbought or oversold. Below 30 = oversold (potential buy opportunity). Above 70 = overbought (potential sell opportunity). Think of it like a rubber band — stretched too far in either direction, it tends to snap back.",
     ex:"Example: RSI of 17 = deeply oversold. The bot sees this as a strong buy signal."},
    {term:"EMA (Exponential Moving Average)",
     def:"The average price of a coin over a set period, with more weight given to recent prices. When the short EMA crosses above the long EMA, it's called a 'golden cross' — a classic buy signal. When short crosses below long, it's a 'death cross' — a sell signal.",
     ex:"Example: 9 EMA > 21 EMA > 50 EMA = bullish EMA alignment = all averages pointing up."},
    {term:"Bollinger Bands (BB)",
     def:"Three lines around a price chart — an upper band, middle line, and lower band. When price touches the lower band, it's usually considered oversold. When it touches the upper band, overbought. The bots buy near the lower band and sell near the upper band.",
     ex:"Example: Price below BB lower = potential bounce incoming = buy signal."},
    {term:"Fear & Greed Index",
     def:"A number from 0-100 measuring overall crypto market emotion. 0-25 = Extreme Fear (everyone is panic selling — often a good time to buy). 75-100 = Extreme Greed (everyone is buying — often a good time to sell). Contrarian thinking: buy when others fear, sell when others are greedy.",
     ex:"Example: F&G = 25 (Extreme Fear) → bots get a buying bonus signal."},
    {term:"Win Rate",
     def:"The percentage of your closed trades that made money. 50% means half your trades win, half lose. Professional traders aim for 50-65%. Win rate alone doesn't tell the whole story — what matters is that your winning trades make more than your losing trades lose.",
     ex:"Example: 60% win rate with $100 average win and $50 average loss = very profitable system."},
    {term:"Drawdown",
     def:"How much your account dropped from its highest point. If you had $110K and it dropped to $99K, your drawdown is $11K or 10%. Prop firms have strict drawdown limits — if you exceed them, you fail the challenge. The bots automatically reduce position sizes as drawdown increases.",
     ex:"Example: Apex Trader Funding allows max $2,500 trailing drawdown on a $50K account."},
    {term:"Kelly Criterion",
     def:"A mathematical formula that tells you exactly how much of your account to risk on each trade based on your historical win rate. It prevents you from betting too much (going bust) or too little (not growing fast enough). The bots use half-Kelly to be conservative.",
     ex:"Example: 55% win rate → Kelly says bet 10% → Half-Kelly = 5% per trade."},
    {term:"Paper Trading",
     def:"Trading with fake/simulated money to test a strategy without real risk. Your bots are currently paper trading with $100,000 per bot (fake). This builds a track record you can show to prop firms. Once results are consistently good, you switch to real money.",
     ex:"Example: Your $300K paper account = 3 bots × $100K simulated balance each."},
    {term:"Prop Firm (Proprietary Trading Firm)",
     def:"A company that gives skilled traders access to large amounts of capital (their money) in exchange for a share of profits. You pay a small evaluation fee ($20-200), pass a trading challenge, then get funded with $50K-$300K. You keep 80-100% of profits.",
     ex:"Example: Pass Apex evaluation → get $50K funded → make 5%/month → earn $2,250/month."},
    {term:"BTC Dominance",
     def:"Bitcoin's share of the total crypto market cap. High dominance (>55%) means Bitcoin is strong but altcoins are weak. Low dominance (<45%) often signals an 'altseason' where smaller coins outperform. Bots use this to decide whether to focus on BTC or altcoins.",
     ex:"Example: BTC Dom 57.8% = cautious on altcoins like ETH, SOL, AVAX."},
    {term:"ADX (Average Directional Index)",
     def:"Measures trend strength from 0-100. Below 20 = no real trend (ranging market). Above 25 = strong trend forming. Above 40 = very strong trend. The bots use ADX to avoid trading in choppy, directionless markets where signals are unreliable.",
     ex:"Example: ADX 35 + bullish EMA = strong uptrend confirmed = good time to buy."},
    {term:"VWAP (Volume Weighted Average Price)",
     def:"The average price weighted by how much was traded at each price. Institutional traders (banks, hedge funds) use VWAP as a benchmark. Price above VWAP = bullish (institutions are net buyers). Price below VWAP = bearish. Following institutional money is smart.",
     ex:"Example: BTC price above VWAP = institutional support = adds to buy signal."},
  ];

  return `
  <div class="card card-blue">
    <div class="sec-hdr">TRADING GLOSSARY</div>
    <div class="learn-box"><div class="learn-label">📚 LEARNING CENTER</div>

    </div>
  </div>
  <div class="card">
    ${terms.map(t=>`
    <div class="gloss-item">
      <div class="gloss-term">${t.term}</div>
      <div class="gloss-def">${t.def}</div>
      <div class="gloss-example">${t.ex}</div>

    case "bots":    c.innerHTML = renderBots();    break;
    case "trades":  c.innerHTML = renderTrades();  break;
    case "log":     c.innerHTML = renderLog();     break;
    case "learn":   c.innerHTML = renderLearn();   break;
    case "roadmap": c.innerHTML = renderRoadmap(); break;
  }
  // Draw sparklines
  const allEq = [];
  const maxLen = Math.max(...BOTS.map(b=>(state.equity[b]||[]).length), 1);
  if (maxLen > 1) {
    for (let i=0; i<maxLen; i++) {
      let s=0;
      for (const b of BOTS) {
        const eq = state.equity[b]||[];
        const idx = Math.round(i*(eq.length-1)/(maxLen-1));
        s += eq[idx]?.equity||100000;
      }
      allEq.push(s);
    }
    drawSpark("spark-total", allEq, "#1aff6e");
  }
  for (const b of BOTS) {
    const eq = (state.equity[b]||[]).map(e=>e.equity);
    if (eq.length>1) drawSpark(`spark-${b}`, eq, BOT_COLORS[b]);
  }
}

function updateNav() {
  const tabNames = ["dash","bots","trades","log","learn","roadmap"];
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",tabNames[i]===state.tab));
  document.querySelectorAll(".bn").forEach((b,i)=>b.classList.toggle("active",tabNames[i]===state.tab));
}

function switchTab(t) {
  state.tab = t;
  render();
  document.getElementById("content").scrollTop = 0;
}

function updateTime() {
  const el = document.getElementById("timeLbl");
  if (el) el.textContent = new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

setInterval(updateTime, 1000);
setInterval(loadData, 5*60*1000);
updateTime();
loadData();
</script>
</body>
</html>
